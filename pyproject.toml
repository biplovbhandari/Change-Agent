[project]
name = "change-agent"
version = "0.1.0"
description = "Agentic change detection with Google ADK + Gemini, built on Change-Agent (IEEE TGRS 2024)"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    # Core ML
    "torch>=2.1,<2.3",
    "torchvision>=0.16,<0.18",
    "torchaudio>=2.1,<2.3",
    "numpy>=1.26,<2",
    "transformers>=4.37,<4.39",
    "timm>=1.0",
    "einops>=0.8",
    # OpenMMLab (SegFormer backbone)
    "mmcv>=1.7,<1.8",
    "mmsegmentation>=0.30,<0.31",
    "mmengine>=0.10,<0.11",
    # Data & image processing
    "pandas>=2.1",
    "pillow>=10.0",
    "opencv-python-headless>=4.8",
    "scikit-image>=0.22",
    "pyarrow>=15",
    # Web UI
    "streamlit>=1.30",
    # Google ADK (agent framework)
    "google-adk>=1.0",
    "python-dotenv>=1.0",
    # Utilities
    "tqdm>=4.65",
    "setuptools>=82.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.extra-build-dependencies]
mmcv = ["setuptools<72"]
